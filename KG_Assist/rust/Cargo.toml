[package]
name = "kg_assist"
version = "3.0.0"
edition = "2021"

[[bin]]
name = "kg_assist"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Security",
] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true
codegen-units = 1

# Windows GUI 子系统 (不弹控制台窗口)
# 在 build.rs 中设置 /SUBSYSTEM:WINDOWS

