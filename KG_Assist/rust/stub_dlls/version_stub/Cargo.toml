[package]
name = "version_stub"
version = "1.0.0"
edition = "2021"

[lib]
name = "version"
crate-type = ["cdylib"]

[dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
codegen-units = 1
